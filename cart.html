<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart | MAXVOLT</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/main.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script type="module" src="js/firebase-client.js"></script>
  <script src="js/auth-client.js" defer></script>
  <link rel="icon" type="image/png" href="assets/maxvolt-logo.png">

  <style>
    .cart-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
    .cart-layout { display: grid; grid-template-columns: 1fr 360px; gap: 32px; margin-top: 24px; }
    @media (max-width: 900px) { .cart-layout { grid-template-columns: 1fr; } }

    .cart-item {
      display: grid;
      grid-template-columns: 80px 1fr auto auto;
      gap: 16px;
      align-items: center;
      padding: 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 12px;
    }
    @media (max-width: 600px) {
      .cart-item { grid-template-columns: 60px 1fr; }
      .cart-item-qty, .cart-item-price { grid-column: 2; }
    }
    .cart-item-img {
      width: 80px; height: 80px; border-radius: 8px;
      background: var(--bg-muted); display: grid; place-items: center;
      font-size: 2rem; overflow: hidden;
    }
    .cart-item-img img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
    .cart-item-info h4 { margin: 0 0 4px; font-size: 1rem; }
    .cart-item-info p { margin: 0; font-size: 0.85rem; color: var(--text-subtle); }
    .cart-qty-controls {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--bg-muted); padding: 4px; border-radius: 8px;
    }
    .cart-qty-controls button {
      width: 28px; height: 28px; border-radius: 6px; border: none;
      background: var(--bg-elevated); color: var(--text); cursor: pointer;
      font-weight: 700; font-size: 1rem;
    }
    .cart-qty-controls button:hover { background: var(--secondary); color: #fff; }
    .cart-qty-controls span { min-width: 24px; text-align: center; font-weight: 600; }
    .cart-item-price { font-weight: 800; font-size: 1.05rem; color: var(--secondary-light); }
    .cart-remove { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.85rem; margin-top: 4px; }
    .cart-remove:hover { text-decoration: underline; }

    .cart-summary {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 24px; position: sticky; top: 96px;
    }
    .cart-summary h3 { margin-bottom: 20px; }
    .cart-summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; }
    .cart-summary-total {
      display: flex; justify-content: space-between;
      padding-top: 16px; margin-top: 16px;
      border-top: 2px solid var(--border);
      font-size: 1.25rem; font-weight: 800;
    }
    .cart-empty { text-align: center; padding: 80px 20px; }
    .cart-empty-icon { font-size: 4rem; margin-bottom: 16px; opacity: 0.5; }
  </style>
</head>
<body>
  <header>
    <div class="header-content container">
      <a href="index.html" class="logo"><img src="assets/maxvolt-logo.png" alt="MAXVOLT" class="logo-img"></a>
      <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#products">Products</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
      <div class="header-right">
        <a href="cart.html" id="nav-cart" class="btn btn-outline btn-small" style="position:relative;">
          <span aria-hidden="true" style="font-size:1rem;">🛒</span>
          <span class="nav-cart-label">Cart</span>
          <span class="cart-badge" style="display:none;background:var(--secondary);color:#fff;border-radius:999px;padding:2px 8px;font-size:0.75rem;margin-left:4px;">0</span>
        </a>
        <a href="account/login.html" id="nav-login" class="btn btn-outline btn-small">Login</a>
        <a href="account/profile.html" id="nav-account" class="btn btn-outline btn-small" style="display:none;">My Account</a>
      </div>
    </div>
  </header>

  <main class="cart-wrap">
    <h1>Your Cart</h1>

    <div id="cart-content"></div>
  </main>

  <script>
    function renderCart() {
      const cart = window.maxvoltCart.getCart();
      const container = document.getElementById('cart-content');

      if (!cart.length) {
        container.innerHTML = `
          <div class="cart-empty">
            <div class="cart-empty-icon">🛒</div>
            <h2>Your cart is empty</h2>
            <p style="margin: 16px 0 24px;">Browse our products and add items to your cart.</p>
            <a href="index.html#products" class="btn btn-primary">Browse Products</a>
          </div>
        `;
        return;
      }

      const total = window.maxvoltCart.getCartTotal();

      container.innerHTML = `
        <div class="cart-layout">
          <div>
            ${cart.map(item => `
              <div class="cart-item" data-id="${item.id}">
                <div class="cart-item-img">
                  ${item.image ? `<img src="assets/images/${item.image}" alt="${item.model}" onerror="this.style.display='none';this.parentNode.textContent='🔋';">` : '🔋'}
                </div>
                <div class="cart-item-info">
                  <h4>${item.brand} ${item.model}</h4>
                  <p>${item.capacity || ''}</p>
                  <button class="cart-remove" data-remove="${item.id}">Remove</button>
                </div>
                <div class="cart-item-qty">
                  <div class="cart-qty-controls">
                    <button data-dec="${item.id}">−</button>
                    <span>${item.qty}</span>
                    <button data-inc="${item.id}">+</button>
                  </div>
                </div>
                <div class="cart-item-price">₹${(item.numericPrice * item.qty).toLocaleString('en-IN')}</div>
              </div>
            `).join('')}
          </div>

          <aside class="cart-summary">
            <h3>Order Summary</h3>
            <div class="cart-summary-row">
              <span>Items (${window.maxvoltCart.getCartCount()})</span>
              <span>₹${total.toLocaleString('en-IN')}</span>
            </div>
            <div class="cart-summary-row">
              <span>Delivery</span>
              <span style="color:var(--text-subtle);">Calculated at checkout</span>
            </div>
            <div class="cart-summary-total">
              <span>Total</span>
              <span>₹${total.toLocaleString('en-IN')}</span>
            </div>
            <a href="checkout.html" class="btn btn-primary btn-full" style="margin-top:20px;">
              Proceed to Checkout →
            </a>
            <a href="index.html#products" class="btn btn-outline btn-full" style="margin-top:8px;">
              Continue Shopping
            </a>
          </aside>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', renderCart);
    window.addEventListener('cart-updated', renderCart);

    document.addEventListener('click', (e) => {
      const inc = e.target.dataset.inc;
      const dec = e.target.dataset.dec;
      const rem = e.target.dataset.remove;

      if (inc) {
        const cart = window.maxvoltCart.getCart();
        const item = cart.find(i => i.id === inc);
        if (item) window.maxvoltCart.updateQty(inc, item.qty + 1);
      }
      if (dec) {
        const cart = window.maxvoltCart.getCart();
        const item = cart.find(i => i.id === dec);
        if (item) window.maxvoltCart.updateQty(dec, item.qty - 1);
      }
      if (rem) {
        if (confirm('Remove this item from cart?')) {
          window.maxvoltCart.removeFromCart(rem);
        }
      }
    });
  </script>
</body>
</html>
