<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | MAXVOLT</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/main.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script type="module" src="js/firebase-client.js"></script>
  <script src="js/auth-client.js" defer></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <link rel="icon" type="image/png" href="assets/maxvolt-logo.png">

  <style>
    .checkout-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
    .checkout-layout { display: grid; grid-template-columns: 1fr 380px; gap: 32px; margin-top: 24px; }
    @media (max-width: 900px) { .checkout-layout { grid-template-columns: 1fr; } }

    .checkout-section {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px;
    }
    .checkout-section h3 { margin-bottom: 20px; font-size: 1.1rem; }

    .checkout-summary {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 24px; position: sticky; top: 96px;
    }
    .checkout-summary h3 { margin-bottom: 20px; }
    .summary-item {
      display: grid; grid-template-columns: 48px 1fr auto; gap: 12px;
      align-items: center; padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .summary-item:last-of-type { border-bottom: none; }
    .summary-item-img {
      width: 48px; height: 48px; border-radius: 6px;
      background: var(--bg-muted); display: grid; place-items: center;
      font-size: 1.25rem; overflow: hidden;
    }
    .summary-item-img img { width: 100%; height: 100%; object-fit: contain; }
    .summary-item-info h4 { margin: 0; font-size: 0.85rem; }
    .summary-item-info p { margin: 2px 0 0; font-size: 0.75rem; color: var(--text-subtle); }
    .summary-item-price { font-weight: 700; font-size: 0.9rem; }

    .summary-totals { margin-top: 20px; padding-top: 16px; border-top: 2px solid var(--border); }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; }
    .summary-grand {
      display: flex; justify-content: space-between; margin-top: 12px;
      font-size: 1.25rem; font-weight: 800;
    }

    .payment-options { display: grid; gap: 12px; }
    .payment-option {
      display: flex; align-items: center; gap: 12px;
      padding: 16px; border: 1.5px solid var(--border);
      border-radius: var(--radius); cursor: pointer;
      transition: all 200ms;
    }
    .payment-option:hover { border-color: var(--secondary); background: rgba(255,107,0,0.05); }
    .payment-option input[type="radio"] { accent-color: var(--secondary); }
    .payment-option.selected { border-color: var(--secondary); background: rgba(255,107,0,0.08); }

    .order-error {
      background: rgba(239,68,68,0.15); color: #fca5a5;
      border: 1px solid rgba(239,68,68,0.3);
      padding: 12px 16px; border-radius: 8px; margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content container">
      <a href="index.html" class="logo"><img src="assets/maxvolt-logo.png" alt="MAXVOLT" class="logo-img"></a>
      <nav><ul><li><a href="index.html">Home</a></li></ul></nav>
      <div class="header-right">
        <a href="cart.html" class="btn btn-outline btn-small">← Back to Cart</a>
      </div>
    </div>
  </header>

  <main class="checkout-wrap">
    <h1>Checkout</h1>

    <div id="order-error" class="order-error"></div>

    <div class="checkout-layout">
      <div>
        <!-- Contact Info -->
        <div class="checkout-section">
          <h3>Contact Information</h3>
          <div class="form-group">
            <label for="co-name">Full Name *</label>
            <input type="text" id="co-name" required placeholder="Your full name" />
          </div>
          <div class="form-group">
            <label for="co-email">Email *</label>
            <input type="email" id="co-email" required placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label for="co-phone">Phone *</label>
            <input type="tel" id="co-phone" required placeholder="9876543210" />
          </div>
        </div>

        <!-- Shipping Address -->
        <div class="checkout-section">
          <h3>Shipping Address</h3>
          <div class="form-group">
            <label for="co-address">Full Address *</label>
            <textarea id="co-address" required placeholder="House/Flat, Street, Landmark" style="min-height:80px;"></textarea>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div class="form-group">
              <label for="co-city">City *</label>
              <input type="text" id="co-city" required placeholder="Kolkata" />
            </div>
            <div class="form-group">
              <label for="co-pincode">PIN Code *</label>
              <input type="text" id="co-pincode" required placeholder="700001" maxlength="6" />
            </div>
          </div>
        </div>

        <!-- Payment Method -->
        <div class="checkout-section">
          <h3>Payment Method</h3>
          <div class="payment-options">
            <label class="payment-option selected" data-method="razorpay">
              <input type="radio" name="payment" value="razorpay" checked />
              <div>
                <strong>Pay Online (Razorpay)</strong>
                <p style="margin:4px 0 0;font-size:0.85rem;color:var(--text-subtle);">UPI, Card, Netbanking, Wallets</p>
              </div>
            </label>
            <label class="payment-option" data-method="cod">
              <input type="radio" name="payment" value="cod" />
              <div>
                <strong>Cash on Delivery</strong>
                <p style="margin:4px 0 0;font-size:0.85rem;color:var(--text-subtle);">Pay when your order arrives</p>
              </div>
            </label>
          </div>
        </div>
      </div>

      <!-- Order Summary -->
      <aside>
        <div class="checkout-summary">
          <h3>Order Summary</h3>
          <div id="summary-items"></div>
          <div class="summary-totals">
            <div class="summary-row"><span>Subtotal</span><span id="sum-subtotal">₹0</span></div>
            <div class="summary-row"><span>Delivery</span><span style="color:var(--text-subtle);">Free</span></div>
            <div class="summary-grand"><span>Total</span><span id="sum-total">₹0</span></div>
          </div>
          <button id="place-order-btn" class="btn btn-primary btn-full" style="margin-top:20px;">
            Place Order
          </button>
          <p style="font-size:0.75rem;color:var(--text-subtle);text-align:center;margin-top:12px;">
            By placing this order, you agree to our
            <a href="terms-conditions.html" target="_blank">Terms</a> and
            <a href="privacy-policy.html" target="_blank">Privacy Policy</a>.
          </p>
        </div>
      </aside>
    </div>
  </main>

  <script>
    let currentUser = null;
    let placing = false;

    function waitForAuth(cb) {
      if (window.maxvoltAuth) return cb();
      const t = setInterval(() => {
        if (window.maxvoltAuth) { clearInterval(t); cb(); }
      }, 50);
    }

    function showError(msg) {
      const el = document.getElementById('order-error');
      el.textContent = msg;
      el.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderSummary() {
      const cart = window.maxvoltCart.getCart();
      if (!cart.length) {
        window.location.href = 'cart.html';
        return;
      }

      document.getElementById('summary-items').innerHTML = cart.map(item => `
        <div class="summary-item">
          <div class="summary-item-img">
            ${item.image ? `<img src="assets/images/${item.image}" onerror="this.style.display='none';this.parentNode.textContent='🔋';">` : '🔋'}
          </div>
          <div class="summary-item-info">
            <h4>${item.brand} ${item.model}</h4>
            <p>Qty: ${item.qty}</p>
          </div>
          <div class="summary-item-price">₹${(item.numericPrice * item.qty).toLocaleString('en-IN')}</div>
        </div>
      `).join('');

      const total = window.maxvoltCart.getCartTotal();
      document.getElementById('sum-subtotal').textContent = '₹' + total.toLocaleString('en-IN');
      document.getElementById('sum-total').textContent = '₹' + total.toLocaleString('en-IN');
    }

    // Payment option highlighting
    document.querySelectorAll('.payment-option').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
      });
    });

    // Pre-fill from Firebase user + existing profile
    waitForAuth(() => {
      window.maxvoltAuth.onAuthChange(async (user) => {
        if (!user) {
          // Require login for checkout
          sessionStorage.setItem('maxvolt_redirect_after_login', '/checkout.html');
          window.location.href = 'account/login.html';
          return;
        }
        currentUser = user;
        document.getElementById('co-email').value = user.email || '';
        document.getElementById('co-name').value = user.displayName || '';

        // Try to pre-fill from saved profile
        try {
          const profile = await window.maxvoltApi.getProfile();
          if (profile) {
            if (profile.displayName) document.getElementById('co-name').value = profile.displayName;
            if (profile.phone) document.getElementById('co-phone').value = profile.phone;
            if (profile.address) document.getElementById('co-address').value = profile.address;
            if (profile.city) document.getElementById('co-city').value = profile.city;
            if (profile.pincode) document.getElementById('co-pincode').value = profile.pincode;
          }
        } catch (e) { /* ignore */ }
      });
    });

    document.addEventListener('DOMContentLoaded', renderSummary);

    // Place order
    document.getElementById('place-order-btn').addEventListener('click', async () => {
      if (placing) return;

      const name = document.getElementById('co-name').value.trim();
      const email = document.getElementById('co-email').value.trim();
      const phone = document.getElementById('co-phone').value.trim();
      const address = document.getElementById('co-address').value.trim();
      const city = document.getElementById('co-city').value.trim();
      const pincode = document.getElementById('co-pincode').value.trim();
      const paymentMethod = document.querySelector('input[name="payment"]:checked').value;

      if (!name || !email || !phone || !address || !city || !pincode) {
        showError('Please fill in all required fields.');
        return;
      }
      if (!/^\d{10}$/.test(phone.replace(/\D/g, '').slice(-10))) {
        showError('Please enter a valid 10-digit phone number.');
        return;
      }
      if (!/^\d{6}$/.test(pincode)) {
        showError('Please enter a valid 6-digit PIN code.');
        return;
      }

      const cart = window.maxvoltCart.getCart();
      if (!cart.length) {
        showError('Your cart is empty.');
        return;
      }

      const shipping = { name, email, phone, address, city, pincode };
      const items = cart.map(i => ({
        productId: i.id,
        brand: i.brand,
        model: i.model,
        capacity: i.capacity,
        price: i.numericPrice,
        qty: i.qty,
      }));
      const total = window.maxvoltCart.getCartTotal();

      placing = true;
      const btn = document.getElementById('place-order-btn');
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        if (paymentMethod === 'cod') {
          // Direct COD order
          const result = await window.maxvoltApi.createOrder({
            items, shipping, total, paymentMethod: 'cod',
          });
          window.maxvoltCart.clearCart();
          window.location.href = 'order-success.html?id=' + result._id + '&method=cod';
        } else {
          // Razorpay flow
          await startRazorpayCheckout({ items, shipping, total });
        }
      } catch (err) {
        console.error(err);
        showError(err.message || 'Failed to place order. Please try again.');
        btn.disabled = false;
        btn.textContent = originalText;
      } finally {
        placing = false;
      }
    });

    async function startRazorpayCheckout({ items, shipping, total }) {
      const payData = await window.maxvoltApi.createPayment({ amount: total, items, shipping });

      const options = {
        key: payData.keyId,
        amount: payData.amount,
        currency: payData.currency,
        name: 'MAXVOLT',
        description: 'Battery & Power Solutions',
        order_id: payData.razorpayOrderId,
        prefill: {
          name: shipping.name,
          email: shipping.email,
          contact: shipping.phone,
        },
        theme: { color: '#ff6b00' },
        handler: async function (response) {
          try {
            await window.maxvoltApi.verifyPayment({
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature,
              orderId: payData.orderId,
            });
            window.maxvoltCart.clearCart();
            window.location.href = 'order-success.html?id=' + payData.orderId + '&method=razorpay';
          } catch (err) {
            showError('Payment verification failed: ' + err.message);
            document.getElementById('place-order-btn').disabled = false;
            document.getElementById('place-order-btn').textContent = 'Place Order';
          }
        },
        modal: {
          ondismiss: () => {
            document.getElementById('place-order-btn').disabled = false;
            document.getElementById('place-order-btn').textContent = 'Place Order';
          },
        },
      };

      const rzp = new Razorpay(options);
      rzp.open();
    }
  </script>
</body>
</html>
