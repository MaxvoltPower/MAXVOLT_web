<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | MAXVOLT</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../admin/css/admin.css" />

  <script type="module" src="../js/firebase-client.js"></script>
  <script src="../js/auth-client.js" defer></script>
</head>
<body>
  <header>
    <div class="header-content container">
      <a href="../index.html" class="logo"><img src="../assets/maxvolt-logo.png" alt="MAXVOLT" class="logo-img"></a>
      <nav><ul><li><a href="../index.html">Home</a></li></ul></nav>
    </div>
  </header>

  <main class="auth-wrap">
    <form id="login-form" class="auth-card surface">
      <h1>Welcome Back</h1>
      <p>Sign in to your MAXVOLT account</p>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" />
      </div>

      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
      <button type="button" id="google-btn" class="btn btn-outline btn-full" style="margin-top:8px;">Continue with Google</button>

      <p class="auth-alt">
        New to MAXVOLT? <a href="register.html">Create account</a>
      </p>
      <p class="auth-alt">
        <a href="#" id="forgot-link">Forgot password?</a>
      </p>
      <div id="auth-error" class="auth-error" style="display:none;"></div>
    </form>
  </main>

  <script>
    // Wait for maxvoltAuth to be available
    function waitForAuth(cb) {
      if (window.maxvoltAuth) return cb();
      const t = setInterval(() => {
        if (window.maxvoltAuth) { clearInterval(t); cb(); }
      }, 50);
    }

    /**
     * Decide where to send a freshly-signed-in user.
     * Admin → /admin/dashboard.html
     * Customer → /account/profile.html
     * If a "next" param was stashed in sessionStorage, honour it first (for admins only
     * if the target is an admin page).
     */
    function redirectAfterLogin(profile) {
      const stashed = sessionStorage.getItem('maxvolt_redirect_after_login');
      sessionStorage.removeItem('maxvolt_redirect_after_login');

      if (profile && profile.isAdmin) {
        window.location.href = '/admin/dashboard.html';
        return;
      }

      // Regular user
      if (stashed && !stashed.startsWith('/admin')) {
        window.location.href = stashed;
        return;
      }
      window.location.href = 'profile.html';
    }

    waitForAuth(() => {
      // If an admin is already signed in, skip the form entirely.
      window.maxvoltAuth.onAuthChange(async (user) => {
        if (!user) return;
        try {
          const profile = await window.maxvoltApi.verify();
          if (profile && profile.isAdmin) {
            window.location.href = '/admin/dashboard.html';
          }
        } catch { /* ignore — user can still log in manually */ }
      });

      const form = document.getElementById('login-form');
      const errEl = document.getElementById('auth-error');
      const showErr = (m) => { errEl.textContent = m; errEl.style.display = 'block'; };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.style.display = 'none';
        const btn = form.querySelector('button[type="submit"]');
        const orig = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        try {
          await window.maxvoltAuth.signIn(
            document.getElementById('email').value,
            document.getElementById('password').value
          );
          const profile = await window.maxvoltApi.verify();
          redirectAfterLogin(profile);
        } catch (err) {
          showErr(err.message);
          btn.disabled = false;
          btn.textContent = orig;
        }
      });

      document.getElementById('google-btn').addEventListener('click', async () => {
        errEl.style.display = 'none';
        try {
          await window.maxvoltAuth.signInGoogle();
          const profile = await window.maxvoltApi.verify();
          redirectAfterLogin(profile);
        } catch (err) { showErr(err.message); }
      });

      document.getElementById('forgot-link').addEventListener('click', async (e) => {
        e.preventDefault();
        const email = prompt('Enter your account email:');
        if (!email) return;
        try {
          await window.maxvoltAuth.resetPassword(email);
          alert('Password reset email sent. Check your inbox.');
        } catch (err) { showErr(err.message); }
      });
    });
  </script>
</body>
</html>
