<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | MAXVOLT</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../admin/css/admin.css" />

  <script type="module" src="../js/firebase-client.js"></script>
  <script src="../js/auth-client.js" defer></script>
</head>
<body>
  <header>
    <div class="header-content container">
      <a href="../index.html" class="logo"><img src="../assets/maxvolt-logo.png" alt="MAXVOLT" class="logo-img"></a>
    </div>
  </header>

  <main class="auth-wrap">
    <form id="register-form" class="auth-card surface">
      <h1>Create Account</h1>
      <p>Join MAXVOLT to manage orders and quotes</p>

      <div class="form-group"><label>Full Name</label><input type="text" id="name" required /></div>
      <div class="form-group"><label>Email</label><input type="email" id="email" required /></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" required minlength="6" /></div>

      <button type="submit" class="btn btn-primary btn-full">Create Account</button>
      <p class="auth-alt">Already registered? <a href="login.html">Sign in</a></p>
      <div id="auth-error" class="auth-error" style="display:none;"></div>
    </form>
  </main>

  <script>
    function waitForAuth(cb) {
      if (window.maxvoltAuth) return cb();
      const t = setInterval(() => {
        if (window.maxvoltAuth) { clearInterval(t); cb(); }
      }, 50);
    }

    waitForAuth(() => {
      const form = document.getElementById('register-form');
      const errEl = document.getElementById('auth-error');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.style.display = 'none';
        const btn = form.querySelector('button[type="submit"]');
        const orig = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Creating account...';
        try {
          await window.maxvoltAuth.signUp(
            document.getElementById('email').value,
            document.getElementById('password').value,
            document.getElementById('name').value
          );
          const profile = await window.maxvoltApi.verify();
          // Admins created via the standard form still get the admin panel.
          if (profile && profile.isAdmin) {
            window.location.href = '/admin/dashboard.html';
          } else {
            window.location.href = 'profile.html';
          }
        } catch (err) {
          errEl.textContent = err.message;
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = orig;
        }
      });
    });
  </script>
</body>
</html>
