<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account | MAXVOLT</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../admin/css/admin.css" />

  <script type="module" src="../js/firebase-client.js"></script>
  <script src="../js/auth-client.js" defer></script>
</head>
<body>
  <header>
    <div class="header-content container">
      <a href="../index.html" class="logo"><img src="../assets/maxvolt-logo.png" alt="MAXVOLT" class="logo-img"></a>
      <nav>
        <ul>
          <li><a href="orders.html">My Orders</a></li>
          <li><a href="#" id="logout-link">Logout</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container" style="padding: 40px 20px;">
    <div class="section-header"><h2>My Profile</h2></div>

    <form id="profile-form" class="surface" style="max-width:640px;margin:0 auto;">
      <div class="form-group"><label>Email</label><input type="email" id="email" disabled /></div>
      <div class="form-group"><label>Full Name</label><input type="text" id="displayName" /></div>
      <div class="form-group"><label>Phone</label><input type="tel" id="phone" /></div>
      <div class="form-group"><label>Address</label><textarea id="address"></textarea></div>
      <div class="form-group"><label>City</label><input type="text" id="city" /></div>
      <div class="form-group"><label>PIN Code</label><input type="text" id="pincode" /></div>
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <div id="profile-msg" style="margin-top:12px;"></div>
    </form>
  </main>

  <script>
    function waitForAuth(cb) {
      if (window.maxvoltAuth) return cb();
      const t = setInterval(() => {
        if (window.maxvoltAuth) { clearInterval(t); cb(); }
      }, 50);
    }

    waitForAuth(() => {
      window.maxvoltAuth.onAuthChange(async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        document.getElementById('email').value = user.email || '';
        try {
          const p = await window.maxvoltApi.getProfile();
          ['displayName','phone','address','city','pincode'].forEach(k => {
            if (p && p[k]) document.getElementById(k).value = p[k];
          });
        } catch (e) { console.error(e); }
      });

      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await window.maxvoltAuth.signOutUser();
        window.location.href = '../index.html';
      });

      document.getElementById('profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {};
        ['displayName','phone','address','city','pincode'].forEach(k => {
          payload[k] = document.getElementById(k).value;
        });
        try {
          await window.maxvoltApi.updateProfile(payload);
          document.getElementById('profile-msg').textContent = '✓ Profile updated';
        } catch (err) {
          document.getElementById('profile-msg').textContent = '✗ ' + err.message;
        }
      });
    });
  </script>
</body>
</html>
