  <section style="background: linear-gradient(135deg, #001f3f 0%, #003366 100%); color: white; padding: 40px 20px; text-align: center;">
    <div class="container">
      <h1 style="color: white; margin-bottom: 12px;">All Products</h1>
      <p>Browse our complete range of batteries, inverters, and power solutions</p>
    </div>
  </section>

  <section class="container" style="padding: 40px 20px;">
    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="🔍 Search products..." />
      <select id="filter-category-all">
        <option value="">All Categories</option>
      </select>
      <select id="filter-brand-all">
        <option value="">All Brands</option>
      </select>
      <select id="sort-by">
        <option value="default">Sort: Default</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name-asc">Name: A-Z</option>
        <option value="name-desc">Name: Z-A</option>
      </select>
    </div>
    <div class="products-count" id="products-count"></div>
    <div class="product-grid" id="all-products-grid"></div>
  </section>

  <footer>
    <div class="footer-content">

    </div>

    </div>

  <script>
    let allProductsLocal = [];
    let filteredProducts = [];
    let mainJsReady = false;

    // Poll for main.js displayProducts availability
    (function waitForMain() {
      if (typeof window.displayProducts === 'function') {
        mainJsReady = true;
        return;
      }
      const t = setInterval(() => {
        if (typeof window.displayProducts === 'function') {
          mainJsReady = true;
          clearInterval(t);
        }
      }, 50);
      setTimeout(() => clearInterval(t), 5000);
    })();

    async function loadAllProducts() {
      try {
        const res = await fetch('/api/products?limit=1000', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        allProductsLocal = (json?.data?.items) || [];
      } catch (e) {
        console.warn('API unavailable, using JSON fallback');
        try {
          const res = await fetch('data/products.json');
          const data = await res.json();
          const flat = [];
          for (const key in data) {
            if (Array.isArray(data[key])) {
              data[key].forEach(p => flat.push({ ...p, category: key }));
            }
          }
          allProductsLocal = flat;
        } catch (err) {
          console.error('Fallback failed:', err);
          allProductsLocal = [];
        }
      }
      populateFilters();
      applyFilters();
    }

    function populateFilters() {
      const catSelect = document.getElementById('filter-category-all');
      const brandSelect = document.getElementById('filter-brand-all');
      // Deduplicate
      const categories = [...new Set(allProductsLocal.map(p => p.category).filter(Boolean))];
      const brands = [...new Set(allProductsLocal.map(p => p.brand).filter(Boolean))].sort();

      const CATEGORY_LABELS = {
        homeInverterBatteries: 'Home Inverter Batteries',
        homeInverters: 'Home Inverters',
        inverter: 'Inverters',
        carBatteries: 'Car Batteries',
        totoErickshawBatteries: 'TOTO / E-Rickshaw',
        ebikeBatteries: 'E-Bike Batteries',
        ups: 'UPS Systems',
      };
      categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = CATEGORY_LABELS[c] || c;
        catSelect.appendChild(opt);
      });
      brands.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.textContent = b;
        brandSelect.appendChild(opt);
      });
    }

    function getNumericPrice(p) {
      return Number(p.discountedPrice) || Number(p.price) || 0;
    }

    function applyFilters() {
      const search = (document.getElementById('search-input').value || '').toLowerCase();
      const cat = document.getElementById('filter-category-all').value;
      const brand = document.getElementById('filter-brand-all').value;
      const sort = document.getElementById('sort-by').value;

      filteredProducts = allProductsLocal.filter(p => {
        if (cat && p.category !== cat) return false;
        if (brand && p.brand !== brand) return false;
        if (search) {
          const hay = `${p.brand || ''} ${p.model || ''} ${p.capacity || ''} ${p.type || ''}`.toLowerCase();
          if (!hay.includes(search)) return false;
        }
        return true;
      });

      if (sort === 'price-asc') {
        filteredProducts.sort((a, b) => getNumericPrice(a) - getNumericPrice(b));
      } else if (sort === 'price-desc') {
        filteredProducts.sort((a, b) => getNumericPrice(b) - getNumericPrice(a));
      } else if (sort === 'name-asc') {
        filteredProducts.sort((a, b) => `${a.brand} ${a.model}`.localeCompare(`${b.brand} ${b.model}`));
      } else if (sort === 'name-desc') {
        filteredProducts.sort((a, b) => `${b.brand} ${b.model}`.localeCompare(`${a.brand} ${a.model}`));
      }

      document.getElementById('products-count').textContent = `${filteredProducts.length} product(s) found`;

      // Prefer main.js's renderer if it's ready — it has all the availability/stock logic.
      if (mainJsReady && typeof window.displayProducts === 'function') {
        window.displayProducts(filteredProducts, 'all-products-grid');
      } else {
        renderProductsFallback(filteredProducts);
      }
    }

    // Fallback renderer (identical visual output to main.js) — used only if main.js
    // hasn't loaded yet. This avoids any blank grid on slow networks.
    function renderProductsFallback(products) {
      const container = document.getElementById('all-products-grid');
      if (!container) return;
      if (!products || products.length === 0) {
        container.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--text-muted);">
            <div style="font-size:2.5rem;margin-bottom:12px;">🔋</div>
            <p>No products match your filters. Try adjusting them.</p>
          </div>`;
        return;
      }
      container.innerHTML = products.map(p => {
        const priceHtml = p.discountedPrice
          ? `<span style="text-decoration:line-through;color:var(--text-subtle);font-size:0.9rem;margin-right:6px;">₹ ${p.price}</span>
             <span style="color:var(--success);font-weight:800;">₹ ${p.discountedPrice}</span>`
          : `₹ ${p.price}`;
        const pid = p.id || p._id;
        const imgSrc = p.image
          ? (/^(data:|https?:|\/)/.test(p.image) ? p.image : (p.image.startsWith('assets/') ? p.image : 'assets/images/' + p.image))
          : null;
        const availability = p.stock === 0 ? 'Out of Stock' : (p.availability || 'Available');
        const availClass = p.stock === 0 ? 'availability-check'
          : ((p.availability || '').includes('Usually') ? 'availability-usually'
          : ((p.availability || '').includes('Check') ? 'availability-check' : 'availability-available'));
        return `
          <article class="product-card">
            <div class="product-image">
              ${imgSrc
                ? `<img src="${imgSrc}" alt="${p.model}" loading="lazy" style="width:100%;height:100%;object-fit:contain;padding:12px;">`
                : '<div style="display:grid;place-items:center;height:100%;font-size:3rem;">🔋</div>'}
            </div>
            <div class="product-content">
              <div class="product-brand">${p.brand || ''}</div>
              <h3 class="product-model">${p.model || ''}</h3>
              <div class="product-specs">
                ${p.capacity ? `<div class="product-spec"><span class="product-spec-label">Capacity</span><span>${p.capacity}</span></div>` : ''}
                ${p.voltage ? `<div class="product-spec"><span class="product-spec-label">Voltage</span><span>${p.voltage}</span></div>` : ''}
                ${p.warranty ? `<div class="product-spec"><span class="product-spec-label">Warranty</span><span>${p.warranty}</span></div>` : ''}
              </div>
              <div class="product-price">${priceHtml}</div>
              <div class="product-availability ${availClass}">${availability}</div>
              <div class="product-actions">
                <a href="product-detail.html?id=${pid}" class="btn btn-primary btn-small">View Details</a>
                ${p.stock === 0
                  ? `<button class="btn btn-outline btn-small" disabled style="opacity:0.5;">Out of Stock</button>`
                  : `<button class="btn btn-secondary btn-small" data-whatsapp="${pid}">WhatsApp</button>`}
              </div>
            </div>
          </article>`;
      }).join('');

      // Wire WhatsApp buttons in fallback mode
      container.querySelectorAll('[data-whatsapp]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.whatsapp;
          const p = allProductsLocal.find(x => (x.id || x._id) === id);
          if (p && typeof window.openWhatsapp === 'function') {
            window.openWhatsapp(encodeURIComponent(`Hello MAXVOLT, I am interested in ${p.brand} ${p.model}. Please share the current price and availability.`));
          }
        });
      });
    }

    let filterTimer = null;
    function debouncedApplyFilters() {
      clearTimeout(filterTimer);
      filterTimer = setTimeout(applyFilters, 120);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadAllProducts();
      const searchEl = document.getElementById('search-input');
      if (searchEl) searchEl.addEventListener('input', debouncedApplyFilters);
      ['filter-category-all', 'filter-brand-all', 'sort-by'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('change', applyFilters);
      });
    });
  </script>
