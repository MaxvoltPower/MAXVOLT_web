  <section style="background: linear-gradient(135deg, #001f3f 0%, #003366 100%); color: white; padding: 40px 20px; text-align: center;">
    <div class="container">
      <h1 style="color: white; margin-bottom: 12px;">All Products</h1>
      <p>Browse our complete range of batteries, inverters, and power solutions</p>
    </div>
  </section>

  <section class="container" style="padding: 40px 20px;">
    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="🔍 Search products..." />
      <select id="filter-category-all">
        <option value="">All Categories</option>
      </select>
      <select id="filter-brand-all">
        <option value="">All Brands</option>
      </select>
      <select id="sort-by">
        <option value="default">Sort: Default</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name-asc">Name: A-Z</option>
        <option value="name-desc">Name: Z-A</option>
      </select>
    </div>
    <div class="products-count" id="products-count"></div>
    <div class="product-grid" id="all-products-grid"></div>
  </section>

  <footer>
    <div class="footer-content">
      <div class="footer-section">
        <p class="footer-tagline">⚡ TRUSTED POWER ALWAYS</p>
      </div>
      <div class="footer-section">
        <h3>Contact</h3>
        <p>📧 maxvolt.power@gmail.com</p>
        <p>📞 +91 7595941311</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; <span class="copyright-year">2024</span> MAXVOLT. All rights reserved.</p>
    </div>
  </footer>

  <script>
    let allProductsFlatLocal = [];
    let filteredProducts = [];

    async function loadAllProducts() {
      try {
        const res = await fetch('/api/products?limit=1000', { cache: 'no-store' });
        const json = await res.json();
        allProductsFlatLocal = (json?.data?.items) || [];
      } catch (e) {
        console.warn('API unavailable, using fallback');
        try {
          const res = await fetch('data/products.json');
          const data = await res.json();
          const flat = [];
          for (const key in data) {
            if (Array.isArray(data[key])) {
              data[key].forEach(p => flat.push({ ...p, category: key }));
            }
          }
          allProductsFlatLocal = flat;
        } catch (err) {
          console.error(err);
        }
      }
      populateFilters();
      applyFilters();
    }

    function populateFilters() {
      const catSelect = document.getElementById('filter-category-all');
      const brandSelect = document.getElementById('filter-brand-all');
      const categories = [...new Set(allProductsFlatLocal.map(p => p.category).filter(Boolean))];
      const brands = [...new Set(allProductsFlatLocal.map(p => p.brand).filter(Boolean))].sort();
      const CATEGORY_LABELS = {
        homeInverterBatteries: 'Home Inverter Batteries',
        homeInverters: 'Home Inverters',
        inverter: 'Inverters',
        carBatteries: 'Car Batteries',
        totoErickshawBatteries: 'TOTO / E-Rickshaw',
        ebikeBatteries: 'E-Bike Batteries',
        ups: 'UPS Systems',
      };
      categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = CATEGORY_LABELS[c] || c;
        catSelect.appendChild(opt);
      });
      brands.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.textContent = b;
        brandSelect.appendChild(opt);
      });
    }

    function applyFilters() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const cat = document.getElementById('filter-category-all').value;
      const brand = document.getElementById('filter-brand-all').value;
      const sort = document.getElementById('sort-by').value;

      filteredProducts = allProductsFlatLocal.filter(p => {
        if (cat && p.category !== cat) return false;
        if (brand && p.brand !== brand) return false;
        if (search) {
          const hay = `${p.brand || ''} ${p.model || ''} ${p.capacity || ''} ${p.type || ''}`.toLowerCase();
          if (!hay.includes(search)) return false;
        }
        return true;
      });

      if (sort === 'price-asc') {
        filteredProducts.sort((a, b) => (Number(a.discountedPrice) || Number(a.price) || 0) - (Number(b.discountedPrice) || Number(b.price) || 0));
      } else if (sort === 'price-desc') {
        filteredProducts.sort((a, b) => (Number(b.discountedPrice) || Number(b.price) || 0) - (Number(a.discountedPrice) || Number(a.price) || 0));
      } else if (sort === 'name-asc') {
        filteredProducts.sort((a, b) => `${a.brand} ${a.model}`.localeCompare(`${b.brand} ${b.model}`));
      } else if (sort === 'name-desc') {
        filteredProducts.sort((a, b) => `${b.brand} ${b.model}`.localeCompare(`${a.brand} ${a.model}`));
      }

      document.getElementById('products-count').textContent = `${filteredProducts.length} product(s) found`;

      // Use main.js displayProducts
      if (typeof displayProducts === 'function') {
        displayProducts(filteredProducts, 'all-products-grid');
      }
    }

    // Wait until main.js has defined displayProducts and its own loader has finished
    function whenMainReady(cb) {
      if (typeof window.displayProducts === 'function') return cb();
      const t = setInterval(() => {
        if (typeof window.displayProducts === 'function') {
          clearInterval(t);
          cb();
        }
      }, 50);
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Delay to let main.js finish its initial load (avoids double render)
      setTimeout(() => {
        loadAllProducts();
        ['search-input', 'filter-category-all', 'filter-brand-all', 'sort-by'].forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.addEventListener('input', applyFilters);
            el.addEventListener('change', applyFilters);
          }
        });
      }, 600);
    });
  </script>
</body>
