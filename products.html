    @media (max-width: 600px) {
      .filter-bar { grid-template-columns: 1fr; }
    }
    .filter-bar input,

      padding: 12px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg-muted);
      color: var(--text);
      font-size: 0.95rem;
    }
    .products-count {
      text-align: center;
      color: var(--text-subtle);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
  </style>
</head>

  <section style="background: linear-gradient(135deg, #001f3f 0%, #003366 100%); color: white; padding: 40px 20px; text-align: center;">
    <div class="container">
      <h1 style="color: white; margin-bottom: 12px;">All Products</h1>
      <p>Browse our complete range of batteries, inverters, and power solutions</p>
    </div>
  </section>

  <section class="container" style="padding: 40px 20px;">
    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="🔍 Search products..." />
      <select id="filter-category-all">
        <option value="">All Categories</option>
      </select>
      <select id="filter-brand-all">
        <option value="">All Brands</option>
      </select>
      <select id="sort-by">
        <option value="default">Sort: Default</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name-asc">Name: A-Z</option>
        <option value="name-desc">Name: Z-A</option>
      </select>
    </div>
    <div class="products-count" id="products-count"></div>
    <div class="product-grid" id="all-products-grid"></div>
  </section>

  <footer>
    <div class="footer-content">
      <div class="footer-section">
        <p class="footer-tagline">⚡ TRUSTED POWER ALWAYS</p>
      </div>
      <div class="footer-section">
        <h3>Contact</h3>
        <p>📧 maxvolt.power@gmail.com</p>
        <p>📞 +91 7595941311</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; <span class="copyright-year">2024</span> MAXVOLT. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // ============================================================
    // Self-contained products page — no dependency on main.js
    // ============================================================

    let allProductsLocal = [];
    let filteredProducts = [];

    // ---------- Load products ----------
    async function loadAllProducts() {
      // 1. Try live API
      try {
        const res = await fetch('/api/products?limit=1000', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        const items = (json && json.data && json.data.items) || [];
        if (items.length) {
          allProductsLocal = items;
          populateFilters();
          applyFilters();
          return;
        }
      } catch (e) {
        console.warn('API unavailable, using JSON fallback:', e.message);
      }

      // 2. Fallback to static JSON
      try {
        const res = await fetch('data/products.json');
        const data = await res.json();
        const flat = [];
        for (const key in data) {
          if (Array.isArray(data[key])) {
            data[key].forEach(p => flat.push({ ...p, category: key }));
          }
        }
        allProductsLocal = flat;
      } catch (err) {
        console.error('Fallback failed:', err);
        allProductsLocal = [];
      }

      populateFilters();
      applyFilters();
    }

    // ---------- Image resolver (single source of truth) ----------
    function resolveImg(img) {
      if (!img) return null;
      if (typeof img !== 'string') return null;
      const s = img.trim();
      if (!s) return null;
      if (s.startsWith('data:')) return s;
      if (/^https?:\/\//i.test(s)) return s;
      if (s.startsWith('/')) return s;
      if (s.startsWith('assets/')) return s;
      return 'assets/images/' + s;
    }

    // ---------- Numeric price ----------
    function getNumericPrice(p) {
      const dp = Number(p.discountedPrice);
      if (Number.isFinite(dp) && dp > 0) return dp;
      const pr = Number(p.price);
      return Number.isFinite(pr) ? pr : 0;
    }

    // ---------- Category labels ----------
    const CATEGORY_LABELS = {
      homeInverterBatteries: 'Home Inverter Batteries',
      homeInverters: 'Home Inverters',
      inverter: 'Inverters',
      carBatteries: 'Car Batteries',
      totoErickshawBatteries: 'TOTO / E-Rickshaw',
      ebikeBatteries: 'E-Bike Batteries',
      ups: 'UPS Systems',
      upsOffice: 'UPS Systems',
    };

    // ---------- Populate filter dropdowns ----------
    function populateFilters() {
      const catSelect = document.getElementById('filter-category-all');
      const brandSelect = document.getElementById('filter-brand-all');
      if (!catSelect || !brandSelect) return;

      // Preserve current selection
      const prevCat = catSelect.value;
      const prevBrand = brandSelect.value;

      const categories = [...new Set(allProductsLocal.map(p => p.category).filter(Boolean))];
      const brands = [...new Set(allProductsLocal.map(p => p.brand).filter(Boolean))].sort();

      catSelect.innerHTML = '<option value="">All Categories</option>' +
        categories.map(c => `<option value="${c}">${CATEGORY_LABELS[c] || c}</option>`).join('');

      brandSelect.innerHTML = '<option value="">All Brands</option>' +
        brands.map(b => `<option value="${b}">${b}</option>`).join('');

      // Restore selection if it still exists
      if (categories.includes(prevCat)) catSelect.value = prevCat;
      if (brands.includes(prevBrand)) brandSelect.value = prevBrand;
    }

    // ---------- Apply filters ----------
    function applyFilters() {
      const searchEl = document.getElementById('search-input');
      const catEl = document.getElementById('filter-category-all');
      const brandEl = document.getElementById('filter-brand-all');
      const sortEl = document.getElementById('sort-by');
      if (!searchEl || !catEl || !brandEl || !sortEl) return;

      const search = (searchEl.value || '').toLowerCase().trim();
      const cat = catEl.value;
      const brand = brandEl.value;
      const sort = sortEl.value;

      filteredProducts = allProductsLocal.filter(p => {
        if (cat && p.category !== cat) return false;
        if (brand && p.brand !== brand) return false;
        if (search) {
          const hay = `${p.brand || ''} ${p.model || ''} ${p.capacity || ''} ${p.type || ''} ${p.va || ''}`.toLowerCase();
          if (!hay.includes(search)) return false;
        }
        return true;
      });

      if (sort === 'price-asc') {
        filteredProducts.sort((a, b) => getNumericPrice(a) - getNumericPrice(b));
      } else if (sort === 'price-desc') {
        filteredProducts.sort((a, b) => getNumericPrice(b) - getNumericPrice(a));
      } else if (sort === 'name-asc') {
        filteredProducts.sort((a, b) => `${a.brand || ''} ${a.model || ''}`.localeCompare(`${b.brand || ''} ${b.model || ''}`));
      } else if (sort === 'name-desc') {
        filteredProducts.sort((a, b) => `${b.brand || ''} ${b.model || ''}`.localeCompare(`${a.brand || ''} ${a.model || ''}`));
      }

      const countEl = document.getElementById('products-count');
      if (countEl) {
        countEl.textContent = filteredProducts.length
          ? `${filteredProducts.length} product${filteredProducts.length === 1 ? '' : 's'} found`
          : 'No products found';
      }

      renderProducts(filteredProducts);
    }

    // ---------- Render ----------
    function renderProducts(products) {
      const container = document.getElementById('all-products-grid');
      if (!container) return;

      if (!products.length) {
        container.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:64px 16px;color:var(--text-subtle);">
            <div style="font-size:3rem;margin-bottom:12px;">🔋</div>
            <h3 style="margin-bottom:8px;color:var(--text);">No products found</h3>
            <p>Try clearing filters or searching for something else.</p>
          </div>`;
        return;
      }

      container.innerHTML = products.map(p => {
        const pid = p.id || p._id;
        const imgSrc = resolveImg(p.image || (p.images && p.images[0]));
        const outOfStock = typeof p.stock === 'number' && p.stock <= 0;

        const priceHtml = p.discountedPrice
          ? `<span style="text-decoration:line-through;color:var(--text-subtle);font-size:0.85rem;margin-right:8px;">₹${Number(p.price || 0).toLocaleString('en-IN')}</span>
             <span style="color:var(--success);font-weight:800;">₹${Number(p.discountedPrice).toLocaleString('en-IN')}</span>`
          : `₹${Number(p.price || 0).toLocaleString('en-IN')}`;

        const availability = outOfStock ? 'Out of Stock' : (p.availability || 'Available');
        const availClass = outOfStock
          ? 'availability-check'
          : ((p.availability || '').includes('Usually')
              ? 'availability-usually'
              : ((p.availability || '').includes('Check')
                  ? 'availability-check'
                  : 'availability-available'));

        const waData = JSON.stringify({
          id: pid,
          brand: p.brand || '',
          model: p.model || ''
        }).replace(/'/g, '&#39;');

        return `
          <article class="product-card">
            <div class="product-image">
              ${imgSrc
                ? `<img src="${imgSrc}" alt="${p.model || ''}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:contain;padding:12px;" onerror="this.style.display='none';this.parentNode.innerHTML='<div style=\\'display:grid;place-items:center;height:100%;font-size:3rem;\\'>🔋</div>';">`
                : '<div style="display:grid;place-items:center;height:100%;font-size:3rem;">🔋</div>'}
            </div>
            <div class="product-content">
              <div class="product-brand">${p.brand || ''}</div>
              <h3 class="product-model">${p.model || ''}</h3>
              <div class="product-specs">
                ${p.capacity ? `<div class="product-spec"><span class="product-spec-label">Capacity</span><span>${p.capacity}</span></div>` : ''}
                ${p.va ? `<div class="product-spec"><span class="product-spec-label">VA</span><span>${p.va}</span></div>` : ''}
                ${p.voltage ? `<div class="product-spec"><span class="product-spec-label">Voltage</span><span>${p.voltage}</span></div>` : ''}
                ${p.warranty ? `<div class="product-spec"><span class="product-spec-label">Warranty</span><span>${p.warranty}</span></div>` : ''}
              </div>
              <div class="product-price">${priceHtml}</div>
              <div class="product-availability ${availClass}">${availability}</div>
              <div class="product-actions">
                <a href="product-detail.html?id=${pid}" class="btn btn-primary btn-small">View Details</a>
                ${outOfStock
                  ? `<button class="btn btn-outline btn-small" disabled style="opacity:0.5;cursor:not-allowed;">Out of Stock</button>`
                  : `<button class="btn btn-secondary btn-small" data-whatsapp='${waData}'>WhatsApp</button>`}
              </div>
            </div>
          </article>`;
      }).join('');
    }

    // ---------- Debounce ----------
    function debounce(fn, ms) {
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), ms);
      };
    }

    // ---------- Wire up ----------
    document.addEventListener('DOMContentLoaded', () => {
      loadAllProducts();

      const searchEl = document.getElementById('search-input');
      if (searchEl) searchEl.addEventListener('input', debounce(applyFilters, 150));

      ['filter-category-all', 'filter-brand-all', 'sort-by'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('change', applyFilters);
      });

      // Delegated WhatsApp handler
      const grid = document.getElementById('all-products-grid');
      if (grid) {
        grid.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-whatsapp]');
          if (!btn) return;
          try {
            const info = JSON.parse(btn.dataset.whatsapp);
            const msg = encodeURIComponent(
              `Hello MAXVOLT, I am interested in ${info.brand} ${info.model}. Please share the current price and availability.`
            );
            window.open(`https://wa.me/917595941311?text=${msg}`, '_blank');
          } catch (err) {
            console.warn('WhatsApp handler error:', err);
          }
        });
      }
    });

    // Copyright year
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.copyright-year').forEach(el => el.textContent = new Date().getFullYear());
    });
  </script>
</body>
