<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products | MAXVOLT Admin</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <script type="module" src="../js/firebase-client.js"></script>
  <script src="../js/auth-client.js" defer></script>
  <script src="js/admin-api.js" defer></script>
  <script src="js/admin-auth.js" defer></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-side">
      <a href="../index.html" class="admin-brand" title="Go to website"><img src="../assets/maxvolt-logo.png" alt="MAXVOLT"><strong>Admin</strong></a>
      <nav class="admin-nav">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="products.html" class="active">📦 Products</a>
        <a href="sections.html">🏷️ Sections</a>
        <a href="orders.html">🛒 Orders</a>
        <a href="quotes.html">💬 Quotes</a>
        <a href="users.html">👥 Users</a>
        <a href="settings.html">⚙️ Settings</a>
        <a href="#" id="admin-logout">🚪 Logout</a>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <h1>Products</h1>
        <button class="btn btn-primary" id="add-product">+ Add Product</button>
      </div>

      <div class="toolbar">
        <input type="text" id="search" placeholder="Search by model/brand..." />
        <select id="filter-category">
          <option value="">All Categories</option>
          <option value="homeInverterBatteries">Home Inverter Batteries</option>
          <option value="homeInverters">Home Inverters</option>
          <option value="inverter">Inverters</option>
          <option value="carBatteries">Car Batteries</option>
          <option value="totoErickshawBatteries">TOTO / E-Rickshaw</option>
          <option value="ebikeBatteries">E-Bike Batteries</option>
          <option value="ups">UPS Systems</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:60px;"></th>
              <th>Brand</th>
              <th>Model</th>
              <th>Category</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="products-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Product modal -->
  <div class="modal-bg" id="product-modal">
    <form class="modal modal-wide" id="product-form">
      <h2 id="modal-title">Add Product</h2>
      <input type="hidden" id="p-id" />

      <!-- MULTIPLE IMAGES -->
      <div class="form-group">
        <label>Product Images</label>
        <div id="image-dropzone" class="image-dropzone" tabindex="0">
          <div id="image-preview-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;width:100%;"></div>
          <div id="image-placeholder" class="image-placeholder">
            <div style="font-size:2.5rem;">🖼️</div>
            <div><strong>Paste images</strong> (Ctrl/⌘ + V)</div>
            <div style="font-size:0.85rem;color:var(--text-subtle);margin-top:4px;">
              or drag &amp; drop files here, or
              <label for="image-file" class="image-file-label">choose files</label>
            </div>
            <input type="file" id="image-file" accept="image/png,image/jpeg,image/webp,image/gif" multiple style="display:none;" />
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
          <button type="button" class="btn btn-outline btn-small" id="clear-image">Remove all images</button>
          <span id="image-status" style="font-size:0.85rem;color:var(--text-subtle);align-self:center;"></span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group"><label>Brand *</label><input type="text" id="p-brand" required /></div>
        <div class="form-group"><label>Model *</label><input type="text" id="p-model" required /></div>
      </div>

      <div class="form-group">
        <label>Category *</label>
        <select id="p-category" required>
          <option value="homeInverterBatteries">Home Inverter Batteries</option>
          <option value="homeInverters">Home Inverters</option>
          <option value="inverter">Inverters</option>
          <option value="carBatteries">Car Batteries</option>
          <option value="totoErickshawBatteries">TOTO / E-Rickshaw</option>
          <option value="ebikeBatteries">E-Bike Batteries</option>
          <option value="ups">UPS Systems</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group"><label>Capacity / Specs</label><input type="text" id="p-capacity" /></div>
        <div class="form-group"><label>Type</label><input type="text" id="p-type" /></div>
      </div>

      <div class="form-row">
        <div class="form-group"><label>Voltage</label><input type="text" id="p-voltage" /></div>
        <div class="form-group"><label>Warranty</label><input type="text" id="p-warranty" /></div>
      </div>

      <div class="form-row">
        <div class="form-group"><label>MRP / Real Price (₹)</label><input type="number" id="p-price" /></div>
        <div class="form-group"><label>Discounted Price (₹)</label><input type="number" id="p-discountedPrice" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>VA (for inverters/UPS)</label><input type="text" id="p-va" /></div>
        <div class="form-group"><label>Stock Quantity</label><input type="number" id="p-stock" min="0" /></div>
      </div>

      <div class="form-row">
        <div class="form-group"><label>Availability</label><input type="text" id="p-availability" placeholder="Available / Usually Available" /></div>
        <div class="form-group"><label>Best For / Suitable For</label><input type="text" id="p-bestFor" /></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label style="display:flex;gap:8px;align-items:center;">
            <input type="checkbox" id="p-active" checked /> Active (visible on website)
          </label>
        </div>
        <div class="form-group">
          <label style="display:flex;gap:8px;align-items:center;">
            <input type="checkbox" id="p-featured" /> Featured (show on homepage fallback)
          </label>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
      </div>
    </form>
  </div>

  <script>
    let products = [];
    let currentImages = [];

    const tbody = document.getElementById('products-body');
    const modal = document.getElementById('product-modal');
    const form = document.getElementById('product-form');
    const dropzone = document.getElementById('image-dropzone');
    const imagePlaceholder = document.getElementById('image-placeholder');
    const imageStatus = document.getElementById('image-status');

    // ---------- Image resolver ----------
    function resolveImg(img) {
      if (!img) return null;
      if (typeof img !== 'string') return null;
      const s = img.trim();
      if (!s) return null;
      if (s.startsWith('data:')) return s;
      if (/^https?:\/\//i.test(s)) return s;
      if (s.startsWith('/')) return '..' + s;
      if (s.startsWith('assets/')) return '../' + s;
      return '../assets/images/' + s;
    }

    // ---------- Render list ----------
    function render() {
      const q = document.getElementById('search').value.toLowerCase();
      const cat = document.getElementById('filter-category').value;
      const filtered = products.filter(p =>
        (!cat || p.category === cat) &&
        (!q || (p.model || '').toLowerCase().includes(q) || (p.brand || '').toLowerCase().includes(q))
      );

      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--text-subtle);">No products found</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(p => {
        const img = resolveImg(p.image);
        const stock = typeof p.stock === 'number' ? p.stock : 0;
        const priceHtml = p.discountedPrice
          ? `<span style="text-decoration:line-through;color:var(--text-subtle);font-size:0.85rem;">₹${p.price}</span>
             <span style="color:var(--success);font-weight:700;margin-left:6px;">₹${p.discountedPrice}</span>`
          : `₹${p.price || '-'}`;
        return `
          <tr>
            <td>${img
              ? `<img src="${img}" alt="" style="width:44px;height:44px;object-fit:contain;background:var(--bg-muted);border-radius:6px;">`
              : '<div style="width:44px;height:44px;display:grid;place-items:center;background:var(--bg-muted);border-radius:6px;">🔋</div>'}</td>
            <td>${p.brand || '-'}</td>
            <td>${p.model || '-'}</td>
            <td>${p.category || '-'}</td>
            <td>${priceHtml}</td>
            <td>
              <span class="badge badge-${stock > 0 ? 'delivered' : 'failed'}">
                ${stock > 0 ? `${stock} in stock` : 'Out of stock'}
              </span>
            </td>
            <td>
              <span class="badge badge-${p.active !== false ? 'delivered' : 'failed'}">${p.active !== false ? 'Active' : 'Hidden'}</span>
              ${p.featured ? '<span class="badge badge-new" style="margin-left:4px;">Featured</span>' : ''}
            </td>
            <td>
              <button class="btn btn-outline btn-small" data-edit="${p._id}">Edit</button>
              <button class="btn btn-secondary btn-small" data-del="${p._id}">Delete</button>
            </td>
          </tr>`;
      }).join('');
    }

    // ---------- Open modal ----------
    function openModal(p = null) {
      document.getElementById('modal-title').textContent = p ? 'Edit Product' : 'Add Product';
      document.getElementById('p-id').value = p?._id || '';

      ['brand','model','category','capacity','type','voltage','warranty','price','discountedPrice','availability','bestFor','va','stock'].forEach(k => {
        const el = document.getElementById('p-' + k);
        if (el) el.value = p?.[k] ?? '';
      });

      document.getElementById('p-active').checked = p ? p.active !== false : true;
      document.getElementById('p-featured').checked = p ? p.featured === true : false;

      currentImages = p?.images || (p?.image ? [p.image] : []);
      updateImagePreview();

      modal.classList.add('open');
    }

    function closeModal() {
      modal.classList.remove('open');
      form.reset();
      currentImages = [];
      updateImagePreview();
      imageStatus.textContent = '';
    }

    // ---------- Image preview ----------
    function updateImagePreview() {
      const grid = document.getElementById('image-preview-grid');
      if (!grid) return;
      grid.innerHTML = currentImages.map((img, i) => `
        <div style="position:relative;border-radius:8px;overflow:hidden;background:var(--bg-muted);aspect-ratio:1;">
          <img src="${resolveImg(img)}" style="width:100%;height:100%;object-fit:contain;padding:4px;" />
          <button type="button" data-remove-img="${i}" style="position:absolute;top:4px;right:4px;background:rgba(239,68,68,0.9);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:0.75rem;display:grid;place-items:center;">✕</button>
        </div>
      `).join('');
      imagePlaceholder.style.display = currentImages.length ? 'none' : 'block';
    }

    // ---------- Clipboard paste ----------
    dropzone.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type && item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) {
            e.preventDefault();
            handleImageFile(file);
            return;
          }
        }
      }
    });

    document.addEventListener('paste', (e) => {
      if (!modal.classList.contains('open')) return;
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type && item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) {
            e.preventDefault();
            handleImageFile(file);
            return;
          }
        }
      }
    });

    // ---------- Drag & drop ----------
    ['dragenter','dragover'].forEach(evt =>
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault(); e.stopPropagation();
        dropzone.classList.add('is-dragover');
      })
    );
    ['dragleave','drop'].forEach(evt =>
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault(); e.stopPropagation();
        dropzone.classList.remove('is-dragover');
      })
    );
    dropzone.addEventListener('drop', (e) => {
      const files = e.dataTransfer?.files;
      if (files) Array.from(files).forEach(f => { if (f.type.startsWith('image/')) handleImageFile(f); });
    });

    // ---------- File picker ----------
    document.getElementById('image-file').addEventListener('change', (e) => {
      const files = e.target.files;
      if (files) Array.from(files).forEach(f => handleImageFile(f));
    });

    // ---------- Clear images ----------
    document.getElementById('clear-image').addEventListener('click', () => {
      currentImages = [];
      updateImagePreview();
      imageStatus.textContent = 'All images removed';
    });

    // ---------- Remove image ----------
    document.getElementById('image-preview-grid').addEventListener('click', (e) => {
      const idx = e.target.dataset.removeImg;
      if (idx !== undefined) {
        currentImages.splice(Number(idx), 1);
        updateImagePreview();
      }
    });

    // ---------- File → base64 ----------
    function handleImageFile(file) {
      if (!file.type.startsWith('image/')) {
        imageStatus.textContent = 'Not an image file';
        return;
      }
      const MAX = 2 * 1024 * 1024;
      if (file.size > MAX) {
        imageStatus.textContent = `Too large (${(file.size/1024/1024).toFixed(2)} MB). Max 2 MB.`;
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        currentImages.push(reader.result);
        updateImagePreview();
        imageStatus.textContent = `${currentImages.length} image(s)`;
      };
      reader.onerror = () => { imageStatus.textContent = 'Failed to read file'; };
      reader.readAsDataURL(file);
    }

    // ---------- Load ----------
    async function load() {
      try {
        const res = await window.adminApi.products('?limit=1000&all=1');
        products = res.items || [];
        render();
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="8" style="color:var(--danger);padding:24px;">${e.message}</td></tr>`;
      }
    }

    document.addEventListener('admin-ready', load);
    document.getElementById('add-product').addEventListener('click', () => openModal());
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('search').addEventListener('input', render);
    document.getElementById('filter-category').addEventListener('change', render);

    // ---------- Save ----------
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('p-id').value;
      const payload = {};
      ['brand','model','category','capacity','type','voltage','warranty','availability','bestFor','va'].forEach(k => {
        payload[k] = document.getElementById('p-' + k).value;
      });
      payload.price = Number(document.getElementById('p-price').value) || 0;
      const dpRaw = document.getElementById('p-discountedPrice').value;
      payload.discountedPrice = dpRaw === '' ? null : Number(dpRaw);
      payload.stock = Number(document.getElementById('p-stock').value) || 0;
      payload.active = document.getElementById('p-active').checked;
      payload.featured = document.getElementById('p-featured').checked;
      payload.images = currentImages.length ? currentImages : null;
      payload.image = currentImages[0] || null;

      const btn = document.getElementById('save-btn');
      const orig = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        if (id) await window.adminApi.updateProduct(id, payload);
        else     await window.adminApi.createProduct(payload);
        closeModal();
        load();
      } catch (err) {
        alert('Save failed: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    });

    // ---------- Edit / Delete ----------
    tbody.addEventListener('click', async (e) => {
      const editId = e.target.dataset.edit;
      const delId = e.target.dataset.del;
      if (editId) {
        const p = products.find(x => x._id === editId);
        if (p) openModal(p);
      }
      if (delId) {
        if (!confirm('Delete this product? This cannot be undone.')) return;
        try { await window.adminApi.deleteProduct(delId); load(); }
        catch (err) { alert(err.message); }
      }
    });
  </script>
</body>
</html>
