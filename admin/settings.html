<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | MAXVOLT Admin</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <script type="module" src="../js/firebase-client.js"></script>
  <script src="../js/auth-client.js" defer></script>
  <script src="js/admin-api.js" defer></script>
  <script src="js/admin-auth.js" defer></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-side">
      <a href="../index.html" class="admin-brand" title="Go to website"><img src="../assets/maxvolt-logo.png" alt="MAXVOLT"><strong>Admin</strong></a>
      <nav class="admin-nav">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="products.html">📦 Products</a>
        <a href="orders.html">🛒 Orders</a>
        <a href="quotes.html">💬 Quotes</a>
        <a href="users.html">👥 Users</a>
        <a href="settings.html" class="active">⚙️ Settings</a>
        <a href="#" id="admin-logout">🚪 Logout</a>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar"><h1>Site Settings</h1></div>
      <form id="settings-form" class="surface" style="max-width:720px;">
        <h3 style="margin-bottom:16px;">Business Info</h3>
        <div class="form-group"><label>Business Name</label><input type="text" id="s-name" /></div>
        <div class="form-group"><label>Tagline</label><input type="text" id="s-tagline" /></div>
        <div class="form-group"><label>Phone</label><input type="text" id="s-phone" /></div>
        <div class="form-group"><label>WhatsApp (with country code)</label><input type="text" id="s-whatsapp" /></div>
        <div class="form-group"><label>Email</label><input type="email" id="s-email" /></div>
        <div class="form-group"><label>Address</label><input type="text" id="s-address" /></div>

        <h3 style="margin:32px 0 16px;">Chatbot Settings</h3>
        <div class="form-group">
          <label>Groq API Key</label>
          <input type="password" id="s-chatApiKey" placeholder="gsk_..." />
          <small style="color:var(--text-subtle);font-size:0.8rem;">Get from console.groq.com</small>
        </div>
        <div class="form-group">
          <label>Model Name</label>
          <input type="text" id="s-chatModel" placeholder="e.g. openai/gpt-oss-120b" />
          <small style="color:var(--text-subtle);font-size:0.8rem;">
            Type any Groq model name. See <a href="https://console.groq.com/docs/models" target="_blank" rel="noopener">console.groq.com/docs/models</a>.
          </small>
        </div>
        <div class="form-group">
          <label>Test Chatbot</label>
          <button type="button" class="btn btn-outline btn-small" id="test-chat-btn">Send test message</button>
          <div id="chat-test-result" style="margin-top:8px;font-size:0.85rem;color:var(--text-muted);"></div>
        </div>

        <button type="submit" class="btn btn-primary">Save Settings</button>
        <div id="msg" style="margin-top:12px;"></div>
      </form>
    </main>
  </div>

  <script>
    const KEYS = {
      's-name': 'name', 's-tagline': 'tagline', 's-phone': 'phone',
      's-whatsapp': 'whatsapp', 's-email': 'email', 's-address': 'address',
      's-chatApiKey': 'chatApiKey', 's-chatModel': 'chatModel',
    };

    document.addEventListener('admin-ready', async () => {
      try {
        const s = await window.adminApi.settings();
        for (const id in KEYS) {
          if (s[KEYS[id]]) document.getElementById(id).value = s[KEYS[id]];
        }
      } catch (e) { console.warn(e); }
    });

    document.getElementById('settings-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {};
      for (const id in KEYS) payload[KEYS[id]] = document.getElementById(id).value;
      try {
        await window.adminApi.saveSettings(payload);
        document.getElementById('msg').textContent = '✓ Saved';
      } catch (err) {
        document.getElementById('msg').textContent = '✗ ' + err.message;
      }
    });

    document.getElementById('test-chat-btn').addEventListener('click', async () => {
      const out = document.getElementById('chat-test-result');
      out.textContent = 'Testing…';
      out.style.color = 'var(--text-muted)';

      // Send the CURRENT typed-in values so the admin doesn't have to save first
      const typedKey = document.getElementById('s-chatApiKey').value.trim();
      const typedModel = document.getElementById('s-chatModel').value.trim();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: 'Say hi in one short sentence.',
            history: [],
            // Optional override — server will use these if provided
            apiKeyOverride: typedKey || undefined,
            modelOverride: typedModel || undefined,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        out.textContent = '✓ Bot replied: ' + data.reply;
        out.style.color = 'var(--success)';
      } catch (err) {
        out.textContent = '✗ ' + err.message;
        out.style.color = 'var(--danger)';
      }
    });
  </script>
</body>
</html>
