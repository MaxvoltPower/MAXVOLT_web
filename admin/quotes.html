<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quotes | MAXVOLT Admin</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <script type="module" src="../js/firebase-client.js"></script>
  <script src="../js/auth-client.js" defer></script>
  <script src="js/admin-api.js" defer></script>
  <script src="js/admin-auth.js" defer></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-side">
      <div class="admin-brand"><img src="../assets/maxvolt-logo.png" alt="MAXVOLT"><strong>Admin</strong></div>
      <nav class="admin-nav">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="products.html">📦 Products</a>
        <a href="orders.html">🛒 Orders</a>
        <a href="quotes.html" class="active">💬 Quotes</a>
        <a href="users.html">👥 Users</a>
        <a href="settings.html">⚙️ Settings</a>
        <a href="#" id="admin-logout">🚪 Logout</a>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar"><h1>Quote Requests</h1></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Email</th><th>Requirement</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="quotes-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const QSTATUSES = ['new','contacted','quoted','won','lost'];

    async function load() {
      const tbody = document.getElementById('quotes-body');
      try {
        const quotes = await window.adminApi.quotes();
        if (!quotes.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No quotes yet</td></tr>'; return; }
        tbody.innerHTML = quotes.map(q => `
          <tr>
            <td>${new Date(q.createdAt).toLocaleDateString()}</td>
            <td>${q.name}</td>
            <td><a href="tel:${q.phone}">${q.phone}</a></td>
            <td>${q.email || '-'}</td>
            <td>${q.requirement}</td>
            <td>
              <select data-status="${q._id}">
                ${QSTATUSES.map(s => `<option value="${s}" ${s === q.status ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </td>
            <td>
              <button class="btn btn-primary btn-small" data-save="${q._id}">Save</button>
              <button class="btn btn-secondary btn-small" data-del="${q._id}">Delete</button>
            </td>
          </tr>`).join('');
      } catch (e) { tbody.innerHTML = `<tr><td colspan="7">${e.message}</td></tr>`; }
    }

    document.addEventListener('admin-ready', load);

    document.getElementById('quotes-body').addEventListener('click', async (e) => {
      const saveId = e.target.dataset.save;
      const delId = e.target.dataset.del;
      if (saveId) {
        const sel = document.querySelector(`select[data-status="${saveId}"]`);
        try { await window.adminApi.updateQuote(saveId, { status: sel.value }); alert('Updated'); }
        catch (err) { alert(err.message); }
      }
      if (delId) {
        if (!confirm('Delete this quote request?')) return;
        try { await window.adminApi.deleteQuote(delId); load(); }
        catch (err) { alert(err.message); }
      }
    });
  </script>
</body>
</html>
