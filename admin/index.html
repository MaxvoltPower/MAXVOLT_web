<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | MAXVOLT</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />

  <script type="module" src="../js/firebase-client.js"></script>
  <script src="../js/auth-client.js" defer></script>
</head>
<body>
  <main class="auth-wrap">
    <form id="login-form" class="auth-card surface">
      <div style="text-align:center;margin-bottom:20px;">
        <img src="../assets/maxvolt-logo.png" alt="MAXVOLT" style="height:64px;margin:0 auto 16px;background:#fff;padding:6px 10px;border-radius:10px;">
      </div>
      <h1>Admin Login</h1>
      <p>Sign in with your admin account</p>

      <div class="form-group"><label>Email</label><input type="email" id="email" required /></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" required /></div>

      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
      <div id="auth-error" class="auth-error" style="display:none;"></div>
    </form>
  </main>

  <script>
    function waitForAuth(cb) {
      if (window.maxvoltAuth) return cb();
      const t = setInterval(() => {
        if (window.maxvoltAuth) { clearInterval(t); cb(); }
      }, 50);
    }

    waitForAuth(() => {
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('auth-error');
        errEl.style.display = 'none';
        try {
          await window.maxvoltAuth.signIn(
            document.getElementById('email').value,
            document.getElementById('password').value
          );
          const profile = await window.maxvoltApi.verify();
          if (!profile.isAdmin) {
            await window.maxvoltAuth.signOutUser();
            throw new Error('This account does not have admin access.');
          }
          window.location.href = 'dashboard.html';
        } catch (err) {
          errEl.textContent = err.message;
          errEl.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
