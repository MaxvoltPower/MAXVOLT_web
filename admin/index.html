<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | MAXVOLT</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <script type="module" src="../js/firebase-client.js"></script>
  <script src="../js/auth-client.js" defer></script>
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card surface" style="text-align:center;">
      <img src="../assets/maxvolt-logo.png" alt="MAXVOLT"
           style="height:56px;margin:0 auto 20px;background:#fff;padding:6px 10px;border-radius:10px;">
      <h1>Checking access…</h1>
      <p>Please wait while we verify your account.</p>
    </div>
  </main>

  <script>
    // Fast redirector:
    //   1. If not logged in            → /account/login.html
    //   2. If logged in and admin      → /admin/dashboard.html
    //   3. If logged in and not admin  → /account/profile.html
    function waitForAuth(cb) {
      if (window.maxvoltAuth) return cb();
      const t = setInterval(() => {
        if (window.maxvoltAuth) { clearInterval(t); cb(); }
      }, 50);
    }

    waitForAuth(() => {
      let resolved = false;
      window.maxvoltAuth.onAuthChange(async (user) => {
        if (resolved) return;
        resolved = true;

        if (!user) {
          window.location.replace('/account/login.html');
          return;
        }
        try {
          const profile = await window.maxvoltApi.verify();
          if (profile && profile.isAdmin) {
            window.location.replace('/admin/dashboard.html');
          } else {
            window.location.replace('/account/profile.html');
          }
        } catch (e) {
          console.error(e);
          window.location.replace('/account/login.html');
        }
      });
    });
  </script>
</body>
</html>
